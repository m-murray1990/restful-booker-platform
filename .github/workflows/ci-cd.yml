name: CI/CD Platform Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [trunk, main, develop]
  push:
    branches: [trunk, main, develop]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-java-ci:
    name: Auth Service (Java) - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Upload test reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-test-reports
          path: |
            auth/target/surefire-reports
            auth/target/failsafe-reports
          if-no-files-found: ignore

  assets-ts-ci:
    name: Assets - Lint/Test/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  integration-tests:
    name: Cross-module Integration Tests
    runs-on: ubuntu-latest
    needs:
      - auth-java-ci
      - assets-ts-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Maven verify for core services
        run: mvn -B -ntp -pl auth,booking,room,report,branding,message verify

      - name: Upload integration reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            auth/target/surefire-reports
            auth/target/failsafe-reports
            booking/target/surefire-reports
            booking/target/failsafe-reports
            room/target/surefire-reports
            room/target/f
