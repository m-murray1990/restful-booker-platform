name: CI/CD Platform Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-java-ci:
    name: Auth Service (Java) - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and verify
        run: mvn -B -ntp clean package -DskipTests

  platform-ts-ci:
    name: TypeScript - Lint/Test/Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        working-directory: ./assets
        run: npm ci

      - name: Lint
        working-directory: ./assets
        run: npm run lint

      - name: Test
        working-directory: ./assets
        run: npm test

      - name: Build
        working-directory: ./assets
        run: npm run build

  api-tests:
    name: API Tests (Postman/Newman)
    needs: [auth-java-ci, platform-ts-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start platform services
        run: |
          docker run -d --name booking -p 3000:3000 mwinteringham/restfulbookerplatform_booking:latest
          docker run -d --name auth -p 3004:3004 mwinteringham/restfulbookerplatform_auth:latest
          docker run -d --name room -p 3001:3001 mwinteringham/restfulbookerplatform_room:latest

      - name: Wait for services to be ready
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:3000/booking/actuator/health; do echo "waiting for booking..."; sleep 3; done'
          timeout 90 bash -c 'until curl -sf http://localhost:3004/auth/actuator/health; do echo "waiting for auth..."; sleep 3; done'
          timeout 90 bash -c 'until curl -sf http://localhost:3001/room/actuator/health; do echo "waiting for room..."; sleep 3; done'

      - name: Run API Tests
        run: |
          npx newman run postman/Restful-Booker.postman_collection.json \
            --env-var host=http://localhost:3000 \
            --env-var baseUrl=http://localhost:3000 \
            --env-var authHost=http://localhost:3004 \
            --env-var roomHost=http://localhost:3001 \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml \
            --suppress-exit-code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.xml

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [auth-java-ci, platform-ts-ci]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging
        run: echo "Add staging deploy script/command here"

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [auth-java-ci, platform-ts-ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production
        run: echo "Add production deploy script/command here"
