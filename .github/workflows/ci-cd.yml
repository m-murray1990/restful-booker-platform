name: CI/CD Platform Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [trunk, main, develop]
  push:
    branches: [trunk, main, develop]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-java-ci:
    name: Auth Service (Java) - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Upload test reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-test-reports
          path: |
            auth/target/surefire-reports
            auth/target/failsafe-reports
          if-no-files-found: ignore

  assets-ts-ci:
    name: Assets - Lint/Test/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  integration-tests:
    name: Cross-module Integration Tests
    runs-on: ubuntu-latest
    needs:
      - auth-java-ci
      - assets-ts-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven verify for core services
        run: mvn -B -ntp -pl auth,booking,room,report,branding,message verify

      - name: Upload integration reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            auth/target/surefire-reports
            auth/target/failsafe-reports
            booking/target/surefire-reports
            booking/target/failsafe-reports
            room/target/surefire-reports
            room/target/failsafe-reports
            report/target/surefire-reports
            report/target/failsafe-reports
            branding/target/surefire-reports
            branding/target/failsafe-reports
            message/target/surefire-reports
            message/target/failsafe-reports
          if-no-files-found: ignore

  e2e-tests:
    name: E2E Tests on Sauce Labs
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    needs:
      - auth-java-ci
      - assets-ts-ci
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run E2E Tests on Sauce Labs
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          BROWSER: remote
          TARGET: staging
        run: |
          cd end-to-end-tests
          mvn -B -ntp clean test

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: end-to-end-tests/target/surefire-reports
          if-no-files-found: ignore

  deploy-production:
    name: Deploy to Production (Practice Dry Run)
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    needs:
      - auth-java-ci
      - assets-ts-ci
      - integration-tests
      - e2e-tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Practice deployment
        run: echo "Practice mode: no real production deployment configured"

  smoke-tests:
    name: Post-deploy Smoke Tests
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    needs:
      - deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run production smoke monitor
        run: node .utilities/monitor/prod_monitor.js
